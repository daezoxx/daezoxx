<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Regulatory intelligence lifecycle architecture diagram.">
  <title>Regulatory Intelligence Lifecycle</title>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .t  { font-size: 11.5px; letter-spacing: 1.1px; }
    .d  { font-size: 10.5px; fill: #8FA3BF; }
    .bl { font-size: 9.5px; letter-spacing: 2.4px; fill: #8FA3BF; }

    /* Dashes travel along the stage connectors so the diagram reads as a
       pipeline with a direction, not a stack of boxes. The dash pattern is
       6+6, so one period of 12 loops seamlessly. */
    @keyframes flowDown { from { stroke-dashoffset: 12; } to { stroke-dashoffset: 0; } }

    .flow { stroke-dasharray: 6 6; animation: flowDown 1.1s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; stroke-dasharray: none; }
    }
  </style>

  <defs>
    <marker id="ac" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0.5 6 3.5 0 6.5Z" fill="#22D3EE"/>
    </marker>
    <marker id="av" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0.5 6 3.5 0 6.5Z" fill="#A78BFA"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0.5 6 3.5 0 6.5Z" fill="#F0B429"/>
    </marker>
    <marker id="ae" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0.5 6 3.5 0 6.5Z" fill="#34D399"/>
    </marker>
  </defs>

  <rect width="900" height="640" rx="12" fill="#080B16"/>
  <rect x=".75" y=".75" width="898.5" height="638.5" rx="12" fill="none" stroke="#1E2A44" stroke-width="1.5"/>

  <!-- Header -->
  <text class="mono" x="32" y="30" font-size="12" letter-spacing="3.2" fill="#22D3EE">REGULATORY INTELLIGENCE LIFECYCLE</text>
  <text class="mono" x="868" y="30" font-size="10" letter-spacing="1.6" fill="#8FA3BF" text-anchor="end">SOURCE → RETRIEVAL → DECISION → AUDIT</text>
  <path d="M32 44H868" stroke="#1E2A44"/>

  <!-- ══ BAND A · ACQUIRE ══ -->
  <text class="mono bl" x="24" y="66">01 · ACQUIRE</text>

  <g>
    <rect x="24" y="76" width="199" height="66" rx="7" fill="#0B1020" stroke="#22D3EE" stroke-opacity=".55"/>
    <text class="mono t" x="38" y="99" fill="#22D3EE">SOURCES</text>
    <text class="mono d" x="38" y="117">Statutes · Rulings</text>
    <text class="mono d" x="38" y="132">Guidance · Filings</text>

    <rect x="241" y="76" width="199" height="66" rx="7" fill="#0B1020" stroke="#22D3EE" stroke-opacity=".55"/>
    <text class="mono t" x="255" y="99" fill="#22D3EE">INGESTION</text>
    <text class="mono d" x="255" y="117">Connectors · Scheduling</text>
    <text class="mono d" x="255" y="132">Change detection</text>

    <rect x="458" y="76" width="199" height="66" rx="7" fill="#0B1020" stroke="#22D3EE" stroke-opacity=".55"/>
    <text class="mono t" x="472" y="99" fill="#22D3EE">PARSE + NORMALIZE</text>
    <text class="mono d" x="472" y="117">Sections · Tables</text>
    <text class="mono d" x="472" y="132">Citations · References</text>

    <rect x="675" y="76" width="199" height="66" rx="7" fill="#0B1020" stroke="#22D3EE" stroke-opacity=".55"/>
    <text class="mono t" x="689" y="99" fill="#22D3EE">REGULATORY METADATA</text>
    <text class="mono d" x="689" y="117">Jurisdiction · Authority</text>
    <text class="mono d" x="689" y="132">Effective dates · Version</text>
  </g>
  <g stroke="#22D3EE" stroke-width="1.4" opacity=".8">
    <path d="M226 109h9" marker-end="url(#ac)"/>
    <path d="M443 109h9" marker-end="url(#ac)"/>
    <path d="M660 109h9" marker-end="url(#ac)"/>
  </g>

  <path class="flow" d="M450 142v26" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#ac)"/>

  <!-- ══ BAND B · INDEX ══ -->
  <text class="mono bl" x="24" y="190">02 · INDEX</text>
  <text class="mono" x="876" y="190" font-size="9.5" letter-spacing="1.2" fill="#5A6B85" text-anchor="end">chunking + metadata strategy applied before write</text>

  <g>
    <rect x="24" y="200" width="419" height="66" rx="7" fill="#0B1020" stroke="#A78BFA" stroke-opacity=".55"/>
    <text class="mono t" x="38" y="223" fill="#A78BFA">SPARSE INDEX</text>
    <text class="mono d" x="38" y="241">BM25 lexical matching · OpenSearch</text>
    <text class="mono d" x="38" y="256">Statute numbers, defined terms, exact phrases</text>

    <rect x="457" y="200" width="419" height="66" rx="7" fill="#0B1020" stroke="#A78BFA" stroke-opacity=".55"/>
    <text class="mono t" x="471" y="223" fill="#A78BFA">DENSE INDEX</text>
    <text class="mono d" x="471" y="241">Embeddings · kNN vector search</text>
    <text class="mono d" x="471" y="256">Paraphrase and concept-level recall</text>
  </g>

  <path class="flow" d="M450 266v26" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#av)"/>

  <!-- ══ BAND C · RETRIEVE ══ -->
  <text class="mono bl" x="24" y="314">03 · RETRIEVE</text>

  <g>
    <rect x="24" y="324" width="199" height="66" rx="7" fill="#0B1020" stroke="#A78BFA" stroke-opacity=".55"/>
    <text class="mono t" x="38" y="347" fill="#A78BFA">QUERY UNDERSTANDING</text>
    <text class="mono d" x="38" y="365">Intent · Expansion</text>
    <text class="mono d" x="38" y="380">Jurisdiction + date scope</text>

    <rect x="241" y="324" width="199" height="66" rx="7" fill="#0B1020" stroke="#A78BFA" stroke-opacity=".55"/>
    <text class="mono t" x="255" y="347" fill="#A78BFA">HYBRID RETRIEVAL</text>
    <text class="mono d" x="255" y="365">Sparse + dense in parallel</text>
    <text class="mono d" x="255" y="380">Metadata pre-filtering</text>

    <rect x="458" y="324" width="199" height="66" rx="7" fill="#0B1020" stroke="#A78BFA" stroke-opacity=".55"/>
    <text class="mono t" x="472" y="347" fill="#A78BFA">FUSION</text>
    <text class="mono d" x="472" y="365">Reciprocal rank fusion</text>
    <text class="mono d" x="472" y="380">Authority weighting</text>

    <rect x="675" y="324" width="199" height="66" rx="7" fill="#0B1020" stroke="#A78BFA" stroke-opacity=".55"/>
    <text class="mono t" x="689" y="347" fill="#A78BFA">RERANK</text>
    <text class="mono d" x="689" y="365">Cross-encoder · LLM</text>
    <text class="mono d" x="689" y="380">Precision at low k</text>
  </g>
  <g stroke="#A78BFA" stroke-width="1.4" opacity=".8">
    <path d="M226 357h9" marker-end="url(#av)"/>
    <path d="M443 357h9" marker-end="url(#av)"/>
    <path d="M660 357h9" marker-end="url(#av)"/>
  </g>

  <path class="flow" d="M450 390v26" stroke="#F0B429" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ══ BAND D · REASON + DECIDE ══ -->
  <text class="mono bl" x="24" y="438">04 · REASON + DECIDE</text>

  <g>
    <rect x="24" y="448" width="274" height="66" rx="7" fill="#0B1020" stroke="#F0B429" stroke-opacity=".55"/>
    <text class="mono t" x="38" y="471" fill="#F0B429">GROUNDED REASONING</text>
    <text class="mono d" x="38" y="489">RAG over ranked evidence</text>
    <text class="mono d" x="38" y="504">Citation-bound generation</text>

    <rect x="312" y="448" width="274" height="66" rx="7" fill="#0B1020" stroke="#F0B429" stroke-opacity=".55"/>
    <text class="mono t" x="326" y="471" fill="#F0B429">STRUCTURED DECISION</text>
    <text class="mono d" x="326" y="489">Classification · Risk scoring</text>
    <text class="mono d" x="326" y="504">Confidence + abstention</text>

    <rect x="600" y="448" width="274" height="66" rx="7" fill="#0B1020" stroke="#34D399" stroke-opacity=".6"/>
    <text class="mono t" x="614" y="471" fill="#34D399">PROVENANCE RECORD</text>
    <text class="mono d" x="614" y="489">Span-level citations · Versions</text>
    <text class="mono d" x="614" y="504">Trace id · Immutable audit log</text>
  </g>
  <g stroke-width="1.4" opacity=".85">
    <path d="M301 481h9" stroke="#F0B429" marker-end="url(#ag)"/>
    <path d="M589 481h9" stroke="#34D399" marker-end="url(#ae)"/>
  </g>

  <!-- ══ EVALUATION FEEDBACK LOOP ══ -->
  <text class="mono" x="450" y="540" font-size="10" letter-spacing="1.4" fill="#34D399" text-anchor="middle">OFFLINE EVALUATION FEEDS RETRIEVAL, FUSION AND RERANK TUNING</text>
  <path d="M800 552H100" stroke="#34D399" stroke-width="1.3" stroke-dasharray="5 5" opacity=".7" marker-end="url(#ae)"/>

  <!-- ══ CROSS-CUTTING CONCERNS ══ -->
  <text class="mono bl" x="24" y="586">05 · ACROSS EVERY STAGE</text>
  <rect x="24" y="596" width="850" height="40" rx="7" fill="#0B1020" stroke="#1E2A44" stroke-width="1.5"/>
  <g class="mono" font-size="10.5" letter-spacing="1.1">
    <circle cx="52"  cy="617" r="3" fill="#34D399"/>
    <text x="63"  y="621" fill="#E6EDF3">Evaluation</text>
    <circle cx="185" cy="617" r="3" fill="#22D3EE"/>
    <text x="196" y="621" fill="#E6EDF3">Observability</text>
    <circle cx="338" cy="617" r="3" fill="#F0B429"/>
    <text x="349" y="621" fill="#E6EDF3">Guardrails</text>
    <circle cx="472" cy="617" r="3" fill="#A78BFA"/>
    <text x="483" y="621" fill="#E6EDF3">Versioning</text>
    <circle cx="608" cy="617" r="3" fill="#22D3EE"/>
    <text x="619" y="621" fill="#E6EDF3">Confidence</text>
    <circle cx="744" cy="617" r="3" fill="#F0B429"/>
    <text x="755" y="621" fill="#E6EDF3">Human review</text>
  </g>
</svg>
